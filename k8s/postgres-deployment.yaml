# DVO-L3-7F2A91
# Deployment для запуску PostgreSQL з постійним сховищем

apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: devopslab1

  labels:
    app: postgres
    mascot: kabachok

  annotations:
    devops-lab/mascot-approved: "true"
    devops-lab/mascot: "кабачок"

spec:
  replicas: 1

  selector:
    matchLabels:
      app: postgres

  template:
    metadata:
      labels:
        app: postgres
        mascot: kabachok

      annotations:
        devops-lab/mascot-approved: "true"
        devops-lab/mascot: "кабачок"

    spec:
      containers:
        - name: postgres
          image: postgres:16

          ports:
            - containerPort: 5432

          env:
            - name: POSTGRES_DB
              value: "devopslab"

            - name: POSTGRES_USER
              value: "postgres"

            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secret
                  key: POSTGRES_PASSWORD

          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data

      volumes:
        - name: postgres-storage
          persistentVolumeClaim:
            claimName: postgres-pvc
