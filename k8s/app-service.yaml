# DVO-L3-7F2A91
# Service для доступу до Spring Boot застосунку всередині кластера

apiVersion: v1
kind: Service
metadata:
  name: devopslab1-service
  namespace: devopslab1

  labels:
    app: devopslab1-app
    mascot: kabachok

  annotations:
    devops-lab/mascot-approved: "true"
    devops-lab/mascot: "кабачок"

spec:
  selector:
    app: devopslab1-app

  ports:
    - port: 80
      targetPort: 8080

  type: ClusterIP
